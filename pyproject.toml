[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uTLS"
version = "0.1.0"
description = "A Python port of refraction-networking/utls: TLS client with customizable ClientHello fingerprints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Laoju", email = "hello@laoju.wang" }]
maintainers = [{ name = "Laoju", email = "hello@laoju.wang" }]
keywords = ["tls", "utls", "fingerprint", "clienthello", "ja3", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["cryptography>=42", "brotli>=1.0", "zstandard>=0.21"]

[dependency-groups]
dev = ["pytest>=8", "coverage>=7"]

[tool.setuptools.packages.find]
include = ["utls*"]

[tool.setuptools.package-data]
utls = ["py.typed", "_public_suffix_list.dat"]

[tool.coverage.run]
source = ["utls"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that talk to the public internet",
]
